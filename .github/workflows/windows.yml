name: Build FFmpeg Windows

on:
  workflow_dispatch:
env:
  FFMPEG_VERSION: n8.1.2

  COMMON_FLAGS: >
    --enable-gpl
    --enable-version3
    --enable-nonfree
    --enable-libdav1d
    --enable-libsvtav1
    --enable-libvpx
    --enable-libx264
    --enable-libx265
    --enable-libopus
    --enable-libmp3lame
    --enable-libfdk-aac
    --enable-libass
    --enable-libjxl
    --enable-openssl
    --enable-libsrt
    --enable-libzimg
    --enable-libplacebo
    --enable-libfreetype
    --enable-libfontconfig
    --enable-zlib

jobs:
  build:
    name: Build FFmpeg Windows x64
    runs-on: windows-2022

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

          install: >
            git
            make
            zip
            diffutils
            pkgconf
            nasm
            yasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-dav1d
            mingw-w64-x86_64-svt-av1
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-fdk-aac
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libjxl
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-srt
            mingw-w64-x86_64-zimg
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fontconfig

      - name: Checkout FFmpeg
        shell: msys2 {0}
        run: |
          git clone \
            --depth 1 \
            --branch "$FFMPEG_VERSION" \
            https://github.com/FFmpeg/FFmpeg.git

      - name: Verify dependencies
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          echo "pkg-config:"
          which pkg-config
          pkg-config --version

          echo "libplacebo:"
          pkg-config --exists --print-errors "libplacebo >= 5.229.0"
          echo "other libs:"

          pkg-config --modversion dav1d
          pkg-config --modversion SvtAv1Enc
          pkg-config --modversion vpx
          pkg-config --modversion x264
          pkg-config --modversion x265
          pkg-config --modversion opus
          pkg-config --modversion lame
          pkg-config --modversion fdk-aac
          pkg-config --modversion libass
          pkg-config --modversion libjxl
          pkg-config --modversion srt
          pkg-config --modversion zimg
          pkg-config --modversion libplacebo
          pkg-config --modversion freetype2
          pkg-config --modversion fontconfig

      - name: Configure FFmpeg
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
          cd ffmpeg
          ./configure \
            $COMMON_FLAGS \
            --prefix=/mingw64 \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-d3d11va \
            --enable-dxva2 \
            --enable-mediafoundation

      - name: Build FFmpeg
        shell: msys2 {0}
        run: |
          export PATH=/mingw64/bin:$PATH
          cd ffmpeg
          make -j$(nproc)
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir package
          cp ffmpeg/ffmpeg.exe package/
          cp ffmpeg/ffprobe.exe package/
          cd package
          zip \
            ../ffmpeg-windows-x64.zip \
            *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x64
          path: ffmpeg-windows-x64.zip
          retention-days: 15
